experiment_name: official_reproduction
source: upstream/psto-aav-pursuit-official/configs/train.yaml
official_commit: 764e2a156f4f74fc3d24a25dfaa6871c57ec7944
runtime:
  isaac_sim: "4.1.0"
  python: "3.10"
  omnidrones: "external editable install"
  torchrl: "0.3.1"
seed: 4348
environment:
  physics_dt: 0.01
  policy_hz: 10.0
  policy_dt: 0.1
  frame_skip: 10
  episode_duration: 28.0
  max_episode_steps: 280
  num_envs: 1
  observation_dim: 13
  centralized_state_dim: 84
  num_obstacles: 18
  randomize_resets: false
  randomize_obstacles: false
mappo:
  actor_lr: 0.00006
  critic_lr: 0.00006
  encoder_lr: 0.00006
  gamma: 0.995
  gae_lambda: 0.95
  clip_param: 0.1
  entropy_coef: 0.02
  value_loss_coef: 1.0
  max_grad_norm: 1.0
  ppo_epochs: 4
  num_minibatches: 12
  rollout_steps: 45
  total_frames: 9800000000
  scheduler: sequential_warmup_cosine
  warmup_steps: 21
  sl_lr: 0.00008
  lstm_lr: 0.00008
  lstm_update_frequency: 3
lstm:
  history_length: 10
  prediction_horizon: 10
  hidden_dim: 64
  observation_dropout: 0.25
  continuous_occlusion_probability: 0.35
  max_occlusion_length: 4
  irregular_sampling: true
experiment:
  checkpoint_interval: 10
  evaluation_interval: 3
  num_eval_episodes: 150
  output_directory: results/psto/official_reproduction
