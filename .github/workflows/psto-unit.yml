name: PSTO unit tests

on:
  push:
    paths:
      - "trace/pursuit/**"
      - "tests/psto/**"
      - "configs/psto/**"
      - ".github/workflows/psto-unit.yml"
  pull_request:
    paths:
      - "trace/pursuit/**"
      - "tests/psto/**"
      - "configs/psto/**"
      - ".github/workflows/psto-unit.yml"

jobs:
  pytorch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" pytest pyyaml "torch==2.5.1"
          python -m pip check
          python -c "import numpy, torch, pytest; print('numpy', numpy.__version__, 'torch', torch.__version__, 'pytest', pytest.__version__)"
      - name: Run PSTO tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          OMP_NUM_THREADS: 2
          MKL_NUM_THREADS: 2
        run: python -m pytest -q -ra --maxfail=1 tests/psto
