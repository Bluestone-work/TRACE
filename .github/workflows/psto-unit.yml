name: PSTO unit tests

on:
  push:
    paths:
      - "trace/pursuit/**"
      - "tests/psto/**"
      - "configs/psto/**"
      - ".github/workflows/psto-unit.yml"
  pull_request:
    paths:
      - "trace/pursuit/**"
      - "tests/psto/**"
      - "configs/psto/**"
      - ".github/workflows/psto-unit.yml"

jobs:
  pytorch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: python -m pip install --upgrade pip && python -m pip install pytest pyyaml torch
      - name: Run PSTO tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q tests/psto
